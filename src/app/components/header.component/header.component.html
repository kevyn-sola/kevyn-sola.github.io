<nav id="nav" [class.scrolled]="isScrolled || isMenuOpen" [class.open]="isMenuOpen">
  <a class="nav-logo" [class.visible]="showLogo || isMenuOpen" (click)="goHome()">
    Kevyn SOLA
  </a>

  <div class="nav-links" id="nav-menu" [class.open]="isMenuOpen">
    <a routerLink="/" [fragment]="'projects'" (click)="closeMenu()">Projets</a>
    @if (showCareer) {
      <a routerLink="/" [fragment]="'career'" (click)="closeMenu()">Parcours</a>
    }
    <a routerLink="/" [fragment]="'about'" (click)="closeMenu()">À propos</a>
    <a routerLink="/" [fragment]="'contact'" (click)="closeMenu()">Contact</a>
    <a href="mailto:kevyn.sola@gmail.com" class="nav-cta" (click)="closeMenu()">Disponible</a>
  </div>

  <button
    type="button"
    class="nav-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="nav-menu"
  >
    {{ isMenuOpen ? 'Fermer' : 'Menu' }}
  </button>
</nav>
